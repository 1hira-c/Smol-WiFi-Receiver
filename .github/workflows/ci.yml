# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
  pull_request:

jobs:
  host-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests/host test
      - name: Whitespace and SPDX headers
        run: |
          git diff --check
          if grep -RInE '[[:blank:]]+$' README.md LICENSE LICENSE-MIT docs firmware protocol tests; then
            exit 1
          fi
          python3 -m json.tool protocol/golden_vectors.json >/dev/null
          missing=$(find .github firmware protocol tests -type f \( -name '*.c' -o -name '*.h' -o -name 'CMakeLists.txt' -o -name 'Kconfig' -o -name '*.conf' -o -name '*.overlay' -o -name '*.yml' -o -name '*.yaml' -o -name 'Makefile' \) -print0 | xargs -0 grep -L 'SPDX-License-Identifier')
          grep -q 'SPDX-License-Identifier' ncs-build.sh || missing="${missing}${missing:+$'\n'}ncs-build.sh"
          grep -q 'SPDX-License-Identifier' esp-flash.ps1 || missing="${missing}${missing:+$'\n'}esp-flash.ps1"
          test -z "$missing" || { echo "$missing"; exit 1; }

  nrf54l15:
    runs-on: ubuntu-latest
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.3.1
    defaults:
      run:
        # Bash initializes the toolchain environment in Nordic's container.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install native simulator build dependency
        run: |
          apt-get update
          apt-get install -y make
      - run: |
          west init -l .
          west update -o=--depth=1 -n
      - run: west build -p always -b xiao_nrf54l15/nrf54l15/cpuapp firmware/nrf54l15
      - run: west build -p always -d build-test-generator -b xiao_nrf54l15/nrf54l15/cpuapp firmware/nrf54l15 -- -DCONFIG_SMOL_TEST_GENERATOR=y
      - run: west twister -T tests/zephyr -p native_sim

  esp32c5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c5
          path: firmware/esp32c5
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c5
          path: firmware/esp32c5/test_apps/protocol
